comfyui:
  host: http://127.0.0.1:8188
  timeout: 600
  poll_interval: 5
  default_timeout: 300
  default_poll_interval: 3
# 火山方舟（即梦/Jimeng）API key — 模板 {{api.jimeng.api_key}} / {{api.jimeng.key_name}} 引用
# Web 设置页 UI 不暴露此字段，需手动编辑 config.yaml 或设 JIMENG_API_KEY 环境变量
api:
  jimeng:
    api_key: your-jimeng-api-key
    key_name: Custom
seedream:
  model_version: doubao-seedream-4.0
  size: 2848x1600 (16:9)
  width: 1280
  height: 720
  max_images: 1
  watermark: false
  default_seed: 0
seedance:
  model_version: doubao-seedance-2-0-fast
  resolution: 720p
  aspect_ratio: adaptive
  generate_audio: true
  default_seed: 0
  default_duration: 5
ffmpeg:
  crf: 13
  pix_fmt: yuv420p
  font_family: Microsoft YaHei
  font_size: 48
  audio_codec: aac
  audio_bitrate: 192k
  subtitle:
    font_color: FFFFFF
    outline_color: 000000
    outline_width: 2
    alignment: 2
    margin_v: 40
    shadow: 0
tts:
  voice: zh-CN-XiaoxiaoNeural
  rate: +0%
task:
  batch_prefix: batch
  # 输出目录按分类组织：output/{分类}/{项目名}/
  # {project} = 用户指定的项目名（--name），或时间戳（batch_YYYYMMDD_HHMMSS）
  output_structure:
    shots:  output/shots/{project}
    audio:  output/audio/{project}
    subs:   output/subs/{project}
    merged: output/merged/{project}
    final:  output/final/{project}
    logs:   output/logs/{project}

output:
  shots_dir:  output/shots/{project}
  audio_dir:  output/audio/{project}
  subs_dir:   output/subs/{project}
  merged_dir: output/merged/{project}
  final_dir:  output/final/{project}
merge:
  transition: fade
  transition_duration: 0.5
  tts_mode: whole
  break_between_shots_ms: 600
  silent_sample_rate: 44100
  concat_filename: _concat_list.txt
agent:
  default_seed: 42
  default_duration: 5
  max_retries: 2
  duration_range:
  - 2
  - 20
  prompt_min_length: 10
  prompt_short_duration: 4
  prompt_long_duration: 8
input:
  default_duration: 5
llm:
  enabled: true
  api_url: your-llm-api-url
  api_key: your-llm-api-key
  model: mimo-v2.5
  max_tokens: 1000
  temperature: 0.7
  timeout: 60
