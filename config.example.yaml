logging:
  level: INFO
  dir: output/logs
comfyui:
  host: http://127.0.0.1:8188
  timeout: 600
  poll_interval: 5
  default_timeout: 300
  default_poll_interval: 3
api:
  jimeng:
    api_key: your-jimeng-api-key
    key_name: Custom
seedream:
  model_version: doubao-seedream-4.0
  size: 2848x1600 (16:9)
  width: 1280
  height: 720
  max_images: 1
  watermark: false
  default_seed: 0
seedance:
  model_version: doubao-seedance-2-0-fast
  resolution: 720p
  aspect_ratio: adaptive
  generate_audio: true
  enable_random_seed: true
  default_seed: 0
  default_duration: 5
video:
  fps: 16
  width: 768
  height: 1344
  codec: libx264
  crf: 13
  pix_fmt: yuv420p
ffmpeg:
  crf: 13
  pix_fmt: yuv420p
  profile: main
  font_family: Microsoft YaHei
  font_size: 48
  codec: libx264
  audio_codec: aac
  audio_bitrate: 192k
  subtitle:
    font_color: FFFFFF
    outline_color: 000000
    outline_width: 2
    alignment: 2
    margin_v: 40
    shadow: 0
tts:
  voice: zh-CN-XiaoxiaoNeural
  rate: +0%
output:
  base_dir: output
  shots_dir: output/shots
  audio_dir: output/audio
  subs_dir: output/subs
  merged_dir: output/merged
  final_dir: output/final
merge:
  transition: fade
  transition_duration: 0.5
  filename_prefix: segment_{id}
  tts_mode: whole
  break_between_shots_ms: 600
  silent_sample_rate: 44100
  audio_threshold: 1000
  srt_threshold: 10
  srt_default_duration: 5
  output_filename: final_video.mp4
  concat_filename: _concat_list.txt
agent:
  camera: smooth slow camera push-in
  style: cinematic lighting, professional corporate atmosphere, modern clean design
  default_seed: 42
  filename_prefix: shot_{id}
  default_duration: 5
  max_retries: 2
  duration_range:
  - 2
  - 20
  prompt_min_length: 10
  prompt_short_duration: 4
  prompt_long_duration: 8
input:
  default_duration: 5
  default_asset_type: ai_generated
llm:
  enabled: true
  api_url: your-llm-api-url
  api_key: your-llm-api-key
  model: mimo-v2.5
  max_tokens: 1000
  temperature: 0.7
  timeout: 60
task:
  batch_prefix: batch
  shot_prefix: shot
  id_format: '{batch_id}_{shot_prefix}_{shot_id:03d}'
  output_structure:
    shots: output/{batch_id}/shots
    audio: output/{batch_id}/audio
    subs: output/{batch_id}/subs
    final: output/{batch_id}/final
